name: Daten aktualisieren und deployen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # täglich frische Meta-Daten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Schlägt der Import fehl, wird der eingecheckte Datenstand ausgeliefert.
      - name: Meta-Daten importieren
        run: node scripts/fetch-data.mjs
      # Läuft nur mit hinterlegtem Secret und eingetragenen Riot-IDs (players.json).
      - name: Eigene Spiele abrufen
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node scripts/fetch-matches.mjs
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html css js data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
